# GitHub Pages workflow for the Pokédex Mini site.
#
# What it does:
#   1. "build"  — installs deps, runs `vite build` (outputs to dist/),
#                 uploads the folder as a Pages artifact.
#   2. "deploy" — publishes the artifact to GitHub Pages.
#
# One-time setup in the repo (Settings → Pages → Build and deployment):
#   set Source to "GitHub Actions". Then every push to `main` (and the
#   green "Deploy to GitHub Pages" button at the top of the repo) publishes
#   the site.
#
# NOTE on the base path: vite.config.js hard-codes `base: '/pokedex-mini/'`,
# so the site assumes the repo is named `pokedex-mini`. If you rename the
# repo, update that base path too (or the pages will 404 on their assets).
name: Deploy to GitHub Pages

on:
  # Runs on every push to the default branch
  push:
    branches: [main]
  # ...and on demand, from the "Actions" tab's "Run workflow" button
  workflow_dispatch:

# The permissions needed by actions/deploy-pages + actions/configure-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push supersedes the in-flight one
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
